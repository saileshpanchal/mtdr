# Obligations register — DAC-0032 and DAC-0033.
#
# Both cases were accepted with disposition `proceed-with-constraints`. A constraint that nobody can
# see the state of is a constraint nobody is keeping, so every one of the fifteen is listed here with
# what satisfies it — and, where nothing does yet, that too.
#
# TWO INDEPENDENT FIELDS, not one conflated state. Implementation and verification are different
# dimensions, and a requirement can be fully implemented today and intentionally unverified until
# release. Collapsing them would force a choice between claiming a proof that does not exist and
# hiding work that does.
#
#   implementation: pending | implemented | not-applicable
#   verification:   pending | verified | release-gated | not-applicable
#
# `release-gated` is not a synonym for pending. It means the proof is defined, is owned, and cannot
# be run in this repository state — a trial with an external participant, a round-trip through a
# register nothing here operates. At the first real release these become executable acceptance tests
# rather than prose reminders.
#
# `tests/verify.py` checks this file against both DACs on every run: every constraint present exactly
# once, no invented constraint numbers, legal field values, and evidence that resolves. A constraint
# cannot silently regress, and a DAC cannot gain a constraint that goes unregistered.

register_version: 1.0.0
maintained_by: Sailesh Panchal

obligations:

  # ---- DAC-0032 — typed multi-object conformance and the optional register boundary -------------

  - id: DAC-0032#1
    constraint: Typed normative claims only
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Normative surfaces contain no generic "MTDR conformant" claim without naming record,
      interchange, package, skill, participant/implementation, collection or repository as the
      subject.
    implementation: implemented
    verification: verified
    evidence:
      - specification/validation-result.md
      - schemas/validation-result.schema.json
      - tests/validation/FIX-111-no-collection-subject.md
      - tests/verify.py
    note: >-
      The result contract cannot express an untyped claim — `subject.type` is required. A scan over
      normative surfaces additionally rejects the bare phrase unless it is quoted, which the
      decisions prohibiting it must be able to do.

  - id: DAC-0032#2
    constraint: Version-bound detached records
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Before release, a detached record can identify and durably resolve its record type, applicable
      specification identity and version, and validate without repository-private interpretation.
    implementation: implemented
    verification: verified
    evidence:
      - specification/record-identity.md
      - decisions/TDR-0043-version-bound-detached-records.md
      - decisions/DAC-0043-version-bound-detached-records.md
      - tests/verify.py
    note: >-
      Discharged by TDR-0043. Every record family gains an optional `conforms_to` binding of the
      form mtdr/<package>/<record>@<version>, required of this repository's own governed records
      and enforced by the suite. Resolution is BY RULE --
      records/<package>/schema/<record>.schema.json -- so no registry, network call or service is
      needed to interpret a record. The suite proves it the way the constraint asks rather than the
      way that would be easier: a record is copied OUT to an empty directory and its type,
      specification and schema resolved from the binding alone, then validated there. The earlier
      warning stands and is why the serialisation round-trip is not cited as evidence -- it proved
      nothing about a detached record. Limit, stated in TDR-0043: the detached test is executed by
      the author, so it proves the rule works, not that the scheme is legible to someone meeting it
      cold. That remains constraint 4's question.

  - id: DAC-0032#3
    constraint: Classified normative closure
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Every package dependency is classified and an extracted package passes its applicable
      conformance contract with no undocumented normative dependency; the complete corpus may remain
      durably referenced.
    implementation: implemented
    verification: verified
    evidence:
      - tests/verify.py
      - records/decision/package.yaml
      - records/value/package.yaml
    note: >-
      The missing half is done. Both normative packages are copied into an empty directory with
      ONLY their declared normative dependencies, and their conformance contract is run there with
      nothing else reachable -- each example routed to the schema for its own record type, resolved
      the way a detached reader must. The constraint's own allowance is honoured rather than
      overridden: the complete corpus may remain durably referenced, so a reference classified
      provenance or explanatory may legitimately dangle in an extraction. What may not dangle is a
      normative dependency, or any reference that is unresolved AND undeclared. Falsified in three
      directions before being trusted: a normative dependency absent from disk, an undeclared
      outward reference, and a package schema missing from the extraction. Limit: the trial
      verifies the declaration is sufficient, not that each classification is correct -- whether a
      dependency is truly normative stays a human judgement.

  - id: DAC-0032#4
    constraint: Zero-install proof before release
    owner: Sailesh Panchal
    gates: externally-validated
    gates_note: >-
      Re-scoped by TDR-0045, on subject: the measure concerns a PARTICIPANT -- what someone unknown
      to the author can do unaided with a published distribution -- and under TDR-0032 a claim about
      participant behaviour implies nothing about repository conformance. It is also unsatisfiable
      before the transition it gated, since publication is what makes an unknown participant
      possible. Retained entire, still release-gated, carried in every result. Not discharged, not
      weakened, not deleted. MTDR claims no external validation while this stands.
    measure: >-
      A participant unknown to the author produces and validates the claimed objects from a clean
      distribution without an MTDR application, register, service or maintainer intervention.
    implementation: implemented
    verification: release-gated
    evidence:
      - specification/conformance.md
      - mtdr_validation/README.md
    note: >-
      The distribution requires no MTDR application, register or service; the reference
      implementation needs one third-party library and nothing of this repository's own. The trial
      with an unknown participant has not run, and cannot be simulated by its author.

  - id: DAC-0032#5
    constraint: Registration/export round-trip before release
    owner: Sailesh Panchal
    gates: registered
    gates_note: >-
      Re-scoped by TDR-0044, on subject rather than difficulty: the measure concerns a
      register, this repository performs no registration, and under TDR-0032 a claim about
      one subject implies nothing about another. Retained entire -- measure, owner and note
      unchanged -- and carried in every result. Not discharged, not weakened, not deleted.
    measure: >-
      Pre-entry and post-export comparisons show no material change in semantics, conformance or
      standing, and storage alone produces no `accepted` transition.
    implementation: not-applicable
    verification: release-gated
    evidence: []
    note: >-
      Nothing in this repository performs registration, so there is no implementation here to make.
      The proof requires a register, and belongs to whoever operates one.

  - id: DAC-0032#6
    constraint: No collection-conformance advertising yet
    owner: Sailesh Panchal
    gates: released
    measure: >-
      No normative "MTDR-conformant register/collection" claim until a separately governed, testable
      collection contract covers identity, specification context, lineage, standing evidence,
      lifecycle integrity, no manufacture of standing, portability and export.
    implementation: implemented
    verification: verified
    evidence:
      - schemas/validation-result.schema.json
      - tests/validation/FIX-111-no-collection-subject.md
      - specification/validation-result.md
    note: >-
      The subject is rejected rather than admitted and left to be assessed against nothing. A result
      that cannot be governed cannot be issued.

  - id: DAC-0032#7
    constraint: Narrow lineage preserved
    owner: Sailesh Panchal
    gates: released
    measure: >-
      TDR-0012 remains immutable historical evidence; TDR-0032 displaces only
      register-as-universal-minimum and explicitly retains runtime neutrality, optional consumers and
      the register as a valid pattern.
    implementation: implemented
    verification: verified
    evidence:
      - decisions/TDR-0032-typed-multi-object-conformance.md
      - decisions/TDR-0012-architecture-overview.md
      - CHANGELOG.md
    note: >-
      Supersession is judgement-granular, not file-granular. The suite proves the lineage resolves in
      both directions; that the displacement is narrow is stated in TDR-0032 and read, not computed.

  # ---- DAC-0033 — independent validity dimensions and transition eligibility --------------------

  - id: DAC-0033#1
    constraint: Versioned result contract before release
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Every validation result identifies the typed TDR-0032 subject, applicable specification
      identity/version, four dimensions, reasons, evidence and evaluation context, and rejects
      illegal outcomes by dimension.
    implementation: implemented
    verification: verified
    evidence:
      - specification/validation-result.md
      - schemas/validation-result.schema.json
      - tests/validation/README.md
    note: >-
      Subject and specification identity are required fields rather than prose conventions. Illegal
      dimension/result pairs are rejected by the schema, and the reference implementation refuses
      them at the point of use as well.

  - id: DAC-0033#2
    constraint: Independent layer fixtures
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Fixtures exercise pass, fail, indeterminate and not-applicable wherever legal for each
      dimension without treating the four dimensions as a pass pipeline.
    implementation: implemented
    verification: verified
    evidence:
      - tests/validation/FIX-101-four-dimensions-reported.md
      - tests/validation/FIX-102-structural-failure-recorded-not-cascaded.md
      - tests/validation/FIX-107-candidate-package-not-applicable.md
      - tests/validation/FIX-108-transition-eligibility-indeterminate.md
    note: >-
      FIX-102 is the anti-pipeline case: a structural failure records its dependents explicitly
      instead of skipping them, so a reader can tell "checked and sound" from "never checked".

  - id: DAC-0033#3
    constraint: Incomplete-candidate proof
    owner: Sailesh Panchal
    gates: released
    measure: >-
      After TDR-0019 governs the schema correction, a candidate VR lacking only transition-required
      finance counter-signature passes current-state structural and semantic validity and fails
      ratification eligibility.
    implementation: implemented
    verification: verified
    evidence:
      - records/value/fixtures/incomplete/VR-9301-candidate-awaiting-countersignature.md
      - tests/validation/FIX-117-candidate-ineligible-no-standing.md
      - tests/validation/FIX-118-eligible-still-no-standing.md
      - tests/validation/FIX-119-ratified-standing-evidenced-elsewhere.md
    note: >-
      Satisfied at 1.29 through TDR-0039, which corrected the schema so the state could be represented
      at all. VR-9301 is a candidate lacking only its counter-signatory: structurally and semantically
      valid, relationally clean, and ineligible for ratification. FIX-118 carries the more consequential
      half — the same candidate counter-signed, every machine-verifiable prerequisite satisfied, and
      still no standing.

  - id: DAC-0033#4
    constraint: Relational portability
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Resolved, broken, incompatible and unavailable-reference fixtures produce distinct relational
      results from a declared portable evaluation context without requiring a register or graph.
    implementation: implemented
    verification: verified
    evidence:
      - tests/validation/FIX-103-unavailable-reference-is-indeterminate.md
      - tests/validation/FIX-104-broken-reference-is-relational-failure.md
      - tests/validation/FIX-105-incompatible-specification-version.md
      - tests/validation/FIX-101-four-dimensions-reported.md
    note: >-
      All four cases are distinguished, and what separates unreachable from absent is the *declared
      context* rather than the reference — which is why the context is in the result and not assumed.

  - id: DAC-0033#5
    constraint: No authority or mutation
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Must-not probes prove validators never repair input, fill missing human information, promote
      state, ratify, infer standing or use `indeterminate` as permission; byte comparison preserves
      the assessed object.
    implementation: implemented
    verification: verified
    evidence:
      - tests/validation/FIX-110-no-standing-conferred.md
      - tests/validation/FIX-116-no-repair-or-inferred-value.md
      - tests/validation/FIX-115-indeterminate-without-a-reason.md
      - tests/verify.py
    note: >-
      The closed object rejects `standing`, `ratified`, `suggested_value` and `corrected` outright.
      The suite additionally byte-compares a subject before and after assessment.

  - id: DAC-0033#6
    constraint: VR correction only through TDR-0019
    owner: Sailesh Panchal
    gates: released
    measure: >-
      No opportunistic change to the VR schema or lifecycle under TDR-0033; the inconsistency remains
      explicit until the VR v2 judgement is ratified and remediated.
    implementation: implemented
    verification: verified
    evidence:
      - decisions/TDR-0039-state-relative-requirements.md
      - records/value/schema/vr.schema.json
      - tests/verify.py
    note: >-
      Held, then discharged as required. Until 1.29 the suite asserted the contradiction was still
      there, so an opportunistic fix would trip a check. The correction was then made under a ratified
      decision — TDR-0039, deriving from TDR-0019 and TDR-0033, leaving TDR-0019 unsuperseded because
      its judgement never changed. The guard is replaced rather than removed: the suite now asserts the
      state-relative form in both directions, so neither re-tightening nor over-loosening can return.

  - id: DAC-0033#7
    constraint: Behaviour remains a separate claim
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Participant execution is tested and reported under TDR-0032 behavioural conformance, never as a
      fifth record-validity dimension or an implication from skill-file validity.
    implementation: implemented
    verification: verified
    evidence:
      - specification/validation-result.md
      - schemas/validation-result.schema.json
      - tests/verify.py
    note: >-
      `participant` is inadmissible as a validation subject, so behavioural conformance cannot be
      expressed as a validation result at all. The suite probes that the reference implementation
      refuses it.

  - id: DAC-0033#8
    constraint: No aggregate normative verdict
    owner: Sailesh Panchal
    gates: released
    measure: >-
      Interfaces may summarise for usability but retain and expose every dimension; no normative
      aggregate green result overrides a failure or indeterminate result.
    implementation: implemented
    verification: verified
    evidence:
      - tests/validation/FIX-109-no-aggregate-verdict.md
      - tests/validation/FIX-112-no-dimension-omitted.md
      - mtdr_validation/README.md
      - tests/verify.py
    note: >-
      This was a live breach in the repository's own tooling until 1.24.0. The suite's summary now
      exposes four dimensions and states that its exit status is operational rather than normative;
      the reference implementation offers no `is_valid`, no truthiness and no exit-code helper; and
      the schema has no field an aggregate verdict could occupy.
