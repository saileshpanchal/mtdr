# Package manifest — machine-readable identity and maturity. TDR-0021, TDR-0023.
name: decision
language: decision
primary_record: TDR
records:
  - id: TDR
    specification: specification/tdr.md
    specification_version: 1.14.0
    schema: schema/tdr.schema.json
    templates: [templates/tdr-full.md, templates/tdr-minimal.md, templates/tdr-bare.md]
  - id: DAC
    dependent_on: TDR            # dependent artefact, not a language — TDR-0021
    specification: specification/dac.md
    specification_version: 1.11.0
    schema: schema/dac.schema.json
    templates: [templates/dac.md]
status: normative
conformance_layers:              # specification/conformance.md — maturity is measured, not asserted
  specification: true
  schema: true
  examples: true
  counter_examples: true         # carried in the fixtures' must-not sections
  fixtures: true
  validation_rules: true
  skills: true
skills:
  authoring: [decision-identification, problem-framing-and-decision-capture, evidence-review, governance-review]
  drafting: [draft-tdr]
  assurance: [systems-thinking, counterfactual-and-evidence, accumulated-and-resultant-risk,
              fraud-and-adversarial-thinking, customer-outcomes, systems-dynamics,
              adaptive-capacity, assurance-synthesis]
  governance: [governance-reconstruct, forum-reconstruct, obligation-authority-trace,
               demonstrability-drill, governance-equivalence, forum-evolution,
               regime-preservation, governance-accretion-plan]   # PROPOSED — TDR-0034, not accepted
proposed:                          # not part of the package's conformance claim until ratified
  tdr: TDR-0034
  governance_projection:           # skill-output contract, NOT a record schema and NOT an
    schema: schema/governance-projection.schema.json   # interchange structure (TDR-0022 unamended)
    semantics: validation/governance-projection.md
    rules: validation/governance-rules.md
    fixtures: fixtures/governance/
