# Package manifest — machine-readable identity and maturity. TDR-0021, TDR-0023.
name: value
language: value
primary_record: VR
object: ovc                      # the Operational Value Commitment; the record is its governed memory
specifications:
  supporting:
    - specification/value-contribution.md   # the recovery vocabulary (TDR-0026)
records:
  - id: VR
    specification: specification/vr.md
    specification_version: 2.0.0
    prior_versions:
      - version: 1.3.0
        schema: null             # v1 records validate structurally, never against the v2 schema
    schema: schema/vr.schema.json
    templates: [templates/vr.md]
status: normative
conformance_layers:
  specification: true
  schema: true
  examples: true
  counter_examples: true
  fixtures: true
  validation_rules: true
  skills: true
skills:
  authoring: [value-record]
  lifecycle: [identify-value-contributions, reconcile-value-contributions, draft-value-record,
              challenge-value-record, validate-value-record]
