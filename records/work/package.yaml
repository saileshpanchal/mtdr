# Package manifest — machine-readable identity and maturity. TDR-0021, TDR-0047.
name: work
language: work
primary_record: OIR
object: operational-capability   # the organisational state inherited before operational work
status: experimental             # TDR-0047: published for review; NOT part of the standard
admission: not-passed            # the record admission test has not been passed, and may not be
governed_by: TDR-0046            # the accepted pre-registration this experiment cannot change
preregistration: decisions/evidence/TDR-0046-preregistration.md
specifications:
  supporting:
    - specification/inheritance-contribution.md   # the recovery vocabulary
records:
  - id: OIR
    specification: specification/oir.md
    specification_version: 1.0.0
    schema: schema/oir.schema.json
    templates: [templates/oir.md]
conformance_layers:              # measured, not asserted — and none of it is a conformance claim (TDR-0047)
  specification: true
  schema: true
  examples: true
  counter_examples: true         # carried in the fixtures' must-not sections
  fixtures: true
  validation_rules: true
  skills: true

# Enumerated for the suite and for anyone loading them from the repository. Never collected into the
# standard's distribution bundles, never counted among its skills (TDR-0047).
skills:
  authoring: [operational-inheritance-record]
  lifecycle: [identify-inheritance-contributions, reconcile-inheritance-contributions,
              draft-inheritance-record, challenge-inheritance-record, validate-inheritance-record]
  orchestration: [recover-inheritance-records]   # composition skill — invokes the lifecycle, owns no semantics (TDR-0026)

# Classified closure (TDR-0032). Checked on experimental packages too: the result is admission
# evidence for question 3 of the record admission test (TDR-0046).
dependencies:
  - ref: specification/source-fragment.md
    class: normative
    why: The interchange structure inheritance recovery begins from.
  - ref: specification/record-contribution.md
    class: normative
    why: The structure every inheritance contribution is carried through; its target_object is open for this package.
  - ref: specification/candidate-assembly.md
    class: normative
    why: How contributions become a candidate OIR without acquiring standing.
  - ref: specification/candidacy-and-ratification.md
    class: normative
    why: Where the lifecycle stops and the organisation begins.
  - ref: specification/identity-and-grouping.md
    class: normative
    why: What makes two spans one capability, and what does not.
  - ref: skills/shared/identify-record-contributions
    class: normative
    why: Record-neutral lifecycle stage the inheritance skills compose (TDR-0023).
  - ref: skills/shared/reconcile-record-fragments
    class: normative
    why: Record-neutral lifecycle stage the inheritance skills compose (TDR-0023).
  - ref: skills/shared/challenge-record
    class: normative
    why: Record-neutral lifecycle stage the inheritance skills compose (TDR-0023).
  - ref: skills/shared/validate-record
    class: normative
    why: Record-neutral lifecycle stage the inheritance skills compose (TDR-0023).
  - ref: decisions/TDR-0046-oir-experiment-preregistration.md
    class: conformance
    why: The frozen test this package exists to be judged by.
  - ref: decisions/TDR-0047-experimental-packages.md
    class: conformance
    why: The status under which this package is published, and everything it is excluded from.
  - ref: decisions/evidence/TDR-0046-preregistration.md
    class: conformance
    why: The frozen criteria, held to their committed hash.
  - ref: decisions/TDR-0021-record-package-architecture.md
    class: provenance
    why: Why the package exists, and the admission test it has not passed.
  - ref: decisions/TDR-0018-interpretation-skills-and-the-artefact-boundary.md
    class: provenance
    why: Where this standard stops.
  - ref: decisions/TDR-0023-portable-skill-architecture.md
    class: provenance
    why: Why skills live with the record semantics they serve, and specialise the shared stages.
  - ref: decisions/TDR-0026-value-recovery-vocabulary.md
    class: provenance
    why: The composition ruling the orchestration skill follows.
  - ref: skills/packaging
    class: explanatory
    why: Distribution adapters, which never carry an experimental skill.
