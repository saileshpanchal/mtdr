# Canonical corpus inventory digest — what participates, in what order, and how it is combined.
#
# `corpus_inventory_digest` proves that two arms reconstructed from the SAME EVIDENCE BYTES. It is
# the corpus counterpart of `task_digest`, and it needs a published rule for the same reason: a pin
# an independent adopter cannot recompute is a number they must take on trust, which is the opposite
# of what a pin is for.
#
# `compare/validate.py::corpus_inventory_digest` implements this file and nothing else, and
# `falsify.py` asserts the two agree.

rule_version: 1.0.0

# ---- what participates ------------------------------------------------------------------------
participants:

  # The participant set is derivable TWO WAYS, and a conforming corpus is one where they agree.
  # Stated in this order deliberately: an adopter holding only the public corpus, with no manifest,
  # must still be able to reach the participant set. A rule that could only be applied by whoever
  # holds the private manifest would not be a published rule.

  default_rule: >-
    Every file in the corpus, EXCEPT explanatory and navigation files and known-answer fixtures (see
    below). This is the authoritative determination for any adopter who does not hold a manifest,
    and it is sufficient on its own: a corpus is self-describing under this rule.

  manifest_rule: >-
    Where a corpus manifest is available, its `files` array is the participant set, and it is
    authoritative for any file whose status is genuinely ambiguous.

  the_two_must_agree: >-
    A conforming corpus is one whose manifest participant set EQUALS the set the default rule
    derives — unless the manifest explicitly designates an exception and states the reason, which
    is the only case in which the two may differ. A manifest that silently disagrees with the
    default rule makes the corpus underivable from public material, which this rule exists to
    prevent. Where they agree, the digest is reproducible with or without the manifest, and the
    published reproduction of a pinned value must be demonstrated the harder way — from the corpus
    alone.

  excluded_by_default: >-
    Explanatory and navigation files — READMEs, indexes, contents pages, licence and citation files,
    build or tooling metadata — do NOT participate. They describe the corpus to a human; they are
    not evidence an arm reconstructs from, and including them would make the pin move when the prose
    around the evidence is edited. A manifest may designate one as source material, in which case it
    participates and the manifest states why.

  known_answer_fixtures: >-
    Never participate, and must not be present in the corpus at all. A fixture stating what a good
    reconstruction must and must not do is the answer key.

# ---- ordering ---------------------------------------------------------------------------------
ordering:
  rule: >-
    Ascending lexicographic order by the manifest's `name` field, compared as UTF-8 byte sequences.
    Byte order rather than locale order: a locale-sensitive sort makes the digest depend on where it
    was computed.

# ---- per-file digest --------------------------------------------------------------------------
per_file:
  algorithm: sha256
  input: >-
    The file's exact bytes, as stored. No newline normalisation, no encoding conversion, no
    whitespace stripping. A corpus whose bytes differ is a different corpus, and a normalisation
    here would conceal exactly that.
  encoding: lowercase hexadecimal, 64 characters

# ---- combination ------------------------------------------------------------------------------
combination:
  rule: >-
    Concatenate the per-file lowercase hex digests in the order defined above, with NO separator and
    no other content, producing a 64n-character ASCII string. The final `corpus_inventory_digest` is
    the sha256 of that string's ASCII bytes, again as lowercase hex.
  worked_form: |
    per_file      = [ sha256(bytes(f)) for f in sorted(manifest.files, key=name) ]
    concatenation = "".join(hex(d) for d in per_file)        # no separator
    digest        = sha256(ascii(concatenation))             # lowercase hex

# ---- what the digest does and does not bind ---------------------------------------------------
binds:
  ordered_content_inventory: >-
    The digest binds the CONTENT INVENTORY IN FILENAME ORDER: which evidence bytes are present, how
    many, and which content occupies which position in the name-sorted sequence. Two corpora with
    the same digest hold the same evidence in the same order.
  filenames_are_not_hashed_but_do_order: >-
    Filenames are never hashed — only content digests are concatenated. But filenames determine the
    ORDER of that concatenation, so they affect the digest indirectly. The digest is therefore NOT
    path-independent, and any statement that renaming cannot move the pin is false.
  renaming: >-
    A rename that PRESERVES a file's sort position is invisible to the digest. A rename that CHANGES
    its sort position changes the digest. Both behaviours are verified in the falsification suite,
    because a property stated and not tested is a property nobody has checked.
  swapping: >-
    Swapping two sources' contents between their filenames CHANGES the digest, because it changes
    which content occupies which position. The digest does detect that particular corruption.
  what_it_still_does_not_bind: >-
    It does not bind filenames as values. An order-preserving rename is invisible to it, so the
    digest cannot establish what any source is CALLED, only what the ordered evidence is.
  consequence: >-
    Source identity is therefore still carried separately and explicitly: `files[].name` alongside
    `files[].sha256` in the manifest, and `source_id` alongside `sha256` per source in a capture's
    `source_selection.available_sources`. The digest proves the ordered evidence; the manifest and
    the capture prove the filing. An implementation relying on the digest alone to establish which
    source is which has misread it.
